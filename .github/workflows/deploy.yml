name: Build and deploy PSS Library to GitHub Pages

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Resolve Pages paths
        shell: bash
        env:
          CONFIGURED_BASE: ${{ vars.PAGES_BASE_PATH }}
          CONFIGURED_SITE_URL: ${{ vars.SITE_URL }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [[ -n "$CONFIGURED_BASE" ]]; then
            pages_base="$CONFIGURED_BASE"
          elif [[ "$REPOSITORY_NAME" == "$REPOSITORY_OWNER.github.io" ]]; then
            pages_base="/"
          else
            pages_base="/$REPOSITORY_NAME/"
          fi

          if [[ -n "$CONFIGURED_SITE_URL" ]]; then
            pages_site_url="$CONFIGURED_SITE_URL"
          elif [[ "$pages_base" == "/" ]]; then
            pages_site_url="https://$REPOSITORY_OWNER.github.io"
          else
            pages_site_url="https://$REPOSITORY_OWNER.github.io/$REPOSITORY_NAME"
          fi

          echo "PAGES_BASE_PATH=$pages_base" >> "$GITHUB_ENV"
          echo "PAGES_SITE_URL=$pages_site_url" >> "$GITHUB_ENV"

      - name: Audit guide content
        run: npm run audit-guide

      - name: Sync static PSS snapshot
        run: node scripts/ingestion/sync-snapshot.mjs

      - name: Audit snapshot relationships
        run: node scripts/audit-relationships.mjs

      - name: Build GitHub Pages artifact
        run: npm run deploy:pages -- --base="$PAGES_BASE_PATH" --site-url="$PAGES_SITE_URL"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
